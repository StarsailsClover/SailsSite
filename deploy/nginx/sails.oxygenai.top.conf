server {
    listen 80;
    listen [::]:80;
    server_name sails.oxygenai.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sails.oxygenai.top;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/sails.oxygenai.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sails.oxygenai.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SailsTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /srv/sails-site/current/dist;
    index index.html;
    client_max_body_size 200m;

    include /etc/nginx/snippets/sails-security-headers.conf;

    location = /healthz {
        proxy_pass http://127.0.0.1:8788;
        include /etc/nginx/snippets/sails-proxy-hide-duplicates.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location = /feed.xml {
        proxy_pass http://127.0.0.1:8788/api/v1/feed.xml;
        include /etc/nginx/snippets/sails-proxy-hide-duplicates.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Sails-API-Version 1;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8788/api/v1/sitemap.xml;
        include /etc/nginx/snippets/sails-proxy-hide-duplicates.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Sails-API-Version 1;
    }

    location ^~ /api/v1/admin/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8788;
        include /etc/nginx/snippets/sails-proxy-hide-duplicates.conf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:8788;
        include /etc/nginx/snippets/sails-proxy-hide-duplicates.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 365d;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
        expires 1h;
    }

    location ~* \.(?:js|css|webp|jpg|jpeg|png|svg|woff2)$ {
        try_files $uri =404;
        expires 365d;
    }

    location = / {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location = /index.html {
        return 301 /;
    }

    location / {
        try_files $uri $uri/ @sails_app;
    }

    location @sails_app {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
